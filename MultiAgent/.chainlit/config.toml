[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000
cache = false
persist_user_env = false
mask_user_env = false
allow_origins = ["*"]

[features]
unsafe_allow_html = false
latex = false
user_message_markdown = true
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = true
edit_message = true
allow_thread_sharing = false
favorites = false

[features.spontaneous_file_upload]
enabled = true
accept = { "text/plain" = [".txt"], "text/markdown" = [".md", ".markdown"], "application/pdf" = [".pdf"] }
max_files = 5
max_size_mb = 10

[features.audio]
enabled = false

[features.mcp]
enabled = false

[UI]
name = "AI Assistant"
cot = "hidden"

